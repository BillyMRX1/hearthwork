[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hearthwork"
dynamic = ["version"]
description = "Run a local llama.cpp model and connect Claude Code or Codex to it from one menu, tuned to your own machine."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["llama.cpp", "local llm", "claude code", "codex", "coding agent"]

[project.urls]
Homepage = "https://github.com/BillyMRX1/hearthwork"

[project.scripts]
hearthwork = "hearthwork.cli:main"
hearthwork-check = "hearthwork.cli:check_main"

[tool.setuptools.dynamic]
version = { attr = "hearthwork.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
