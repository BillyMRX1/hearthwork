<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1070" viewBox="0 0 640 1070" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6a4a"/></marker>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e2531f"/><stop offset="1" stop-color="#f6b042"/></linearGradient>
    <style>
      .box { fill: #ffffff; stroke: #e2cba8; stroke-width: 2; }
      .core { fill: #fff6ea; stroke: #e8742a; stroke-width: 2.5; }
      .h { font-size: 20px; font-weight: 700; fill: #3b2a1a; }
      .t { font-size: 15px; fill: #5c4632; }
      .s { font-size: 14px; fill: #8a7058; }
      .chip { fill: #fbe9d3; stroke: #efc79a; stroke-width: 1.5; }
      .chiptext { font-size: 15px; fill: #7a4a1c; font-weight: 600; }
      .line { stroke: #8a6a4a; stroke-width: 2; fill: none; }
      .dash { stroke-dasharray: 6 5; }
      .label { font-size: 14px; fill: #8a6a4a; font-style: italic; }
    </style>
  </defs>
  <rect width="640" height="1070" rx="18" fill="#fffaf3"/>
    <text x="30" y="46" font-size="26" font-weight="800" fill="#3b2a1a">How Hearthwork works</text>
  <text x="30" y="72" class="t">One host per computer, one queue, one model.</text>
  <rect x="30" y="96" width="580" height="262" rx="14" class="box"/>
  <text x="50" y="128" class="h">Your tools (clients)</text>
  <rect x="50" y="142" width="150" height="34" rx="17" class="chip"/><text x="125.0" y="164" text-anchor="middle" class="chiptext">Claude Code</text><rect x="210" y="142" width="100" height="34" rx="17" class="chip"/><text x="260.0" y="164" text-anchor="middle" class="chiptext">Codex</text><rect x="320" y="142" width="120" height="34" rx="17" class="chip"/><text x="380.0" y="164" text-anchor="middle" class="chiptext">OpenCode</text><rect x="450" y="142" width="140" height="34" rx="17" class="chip"/><text x="520.0" y="164" text-anchor="middle" class="chiptext">Qwen Code</text>
  <rect x="50" y="186" width="100" height="34" rx="17" class="chip"/><text x="100.0" y="208" text-anchor="middle" class="chiptext">Aider</text>
  <rect x="160" y="186" width="430" height="34" rx="17" class="chip"/><text x="375.0" y="208" text-anchor="middle" class="chiptext">hearthwork task / MCP (subagents)</text>
  <rect x="50" y="230" width="540" height="34" rx="17" class="chip"/><text x="320.0" y="252" text-anchor="middle" class="chiptext">hearthwork api: any OpenAI or Anthropic app</text>
  <rect x="50" y="274" width="540" height="34" rx="17" class="chip"/><text x="320.0" y="296" text-anchor="middle" class="chiptext">Other computers and phone (hearthwork share)</text>
  <text x="50" y="338" class="s">Same computer, local network or Tailscale</text>
  <path d="M320,358 L320,402" class="line" marker-end="url(#arrow)"/><text x="334" y="385.0" class="label">OpenAI and Anthropic APIs</text>
  <rect x="30" y="402" width="580" height="262" rx="14" class="core"/>
  <text x="50" y="436" class="h">Hearthwork host</text>
  <text x="50" y="458" class="s">Starts in the background, 127.0.0.1:8470</text>
  <rect x="50" y="478" width="540" height="32" rx="8" class="chip"/><text x="64" y="499" class="chiptext">One queue</text><text x="590" y="499" text-anchor="end" class="t">N slots, first come first served</text>
  <rect x="50" y="514" width="540" height="32" rx="8" class="chip"/><text x="64" y="535" class="chiptext">Request cleanup</text><text x="590" y="535" text-anchor="end" class="t">any chat template accepts the request</text>
  <rect x="50" y="550" width="540" height="32" rx="8" class="chip"/><text x="64" y="571" class="chiptext">Tool-call repair</text><text x="590" y="571" text-anchor="end" class="t">text tool calls become real ones</text>
  <rect x="50" y="586" width="540" height="32" rx="8" class="chip"/><text x="64" y="607" class="chiptext">Diagnostics</text><text x="590" y="607" text-anchor="end" class="t">measured numbers, no prompt text</text>
  <rect x="50" y="622" width="540" height="32" rx="8" class="chip"/><text x="64" y="643" class="chiptext">Recovery</text><text x="590" y="643" text-anchor="end" class="t">restarts the model server if it crashes</text>
  <path d="M320,664 L320,708" class="line" marker-end="url(#arrow)"/>
  <rect x="30" y="708" width="580" height="168" rx="14" class="box"/>
  <text x="50" y="742" class="h">llama-server (llama.cpp)</text>
  <text x="50" y="764" class="s">Runs the model. Fits as much on the GPU as it can.</text>
  <rect x="50" y="784" width="330" height="52" rx="10" fill="url(#flame)"/><text x="215" y="816" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">GPU memory</text>
  <rect x="380" y="784" width="210" height="52" rx="10" fill="#d9b88c"/><text x="485" y="816" text-anchor="middle" font-size="18" font-weight="700" fill="#3b2a1a">System RAM</text>
  <text x="50" y="862" class="s">The model is split between the two, per your computer</text>
  <rect x="30" y="916" width="280" height="130" rx="14" class="box"/>
  <rect x="330" y="916" width="280" height="130" rx="14" class="box"/>
  <text x="46" y="948" class="h">Setup and check</text><text x="46" y="974" class="t">Reads your hardware,</text><text x="46" y="996" class="t">recommends a model</text><text x="46" y="1018" class="t">and a llama.cpp build</text>
  <text x="346" y="948" class="h">Budgets, profiles</text><text x="346" y="974" class="t">Leave room for other</text><text x="346" y="996" class="t">work, and save a setup</text><text x="346" y="1018" class="t">that is proven to work</text>
  <path d="M170,916 C170,890 120,890 120,876" class="line dash"/>
  <path d="M470,916 C470,890 520,890 520,876" class="line dash"/>
</svg>
