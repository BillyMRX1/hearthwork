name: Website

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "src/hearthwork/**"
      - "README.md"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: CLI reference is up to date
        run: python docs-site/scripts/gen_cli_reference.py --check

      - name: Install
        working-directory: docs-site
        run: npm ci

      - name: Build
        working-directory: docs-site
        # For a custom domain, uncomment and set these (see docs-site/README.md):
        # env:
        #   SITE_URL: https://hearthwork.dev
        #   SITE_BASE: /
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
